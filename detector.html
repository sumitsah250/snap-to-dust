<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snap to Dust detector</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font: 600 11px/1.3 system-ui, sans-serif; color: #f4efe6; }
  #wrap { display: none; position: relative; width: 256px; border-radius: 12px; overflow: hidden; background: #121014; }
  body.debug #wrap { display: block; }
  canvas { display: block; width: 256px; transform: scaleX(-1); }
  #bar { display: flex; gap: 8px; align-items: center; padding: 6px 9px; background: #1c1920; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #6b6470; flex: none; }
  #dot.set { background: #f2b544; }
  #dot.armed { background: #ff7a45; box-shadow: 0 0 8px #ff7a45; }
  #dot.fired { background: #7cf2a0; box-shadow: 0 0 10px #7cf2a0; }
  #txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="view" width="256" height="144"></canvas>
  <div id="bar"><span id="dot"></span><span id="txt">Waiting for camera…</span></div>
</div>
<script type="module" src="detector.js"></script>
</body>
</html>
